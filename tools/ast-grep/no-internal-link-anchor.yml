id: no-internal-link-anchor
language: Tsx
severity: error
message: Use next/link for internal navigation instead of raw anchors.
note: |
  Rule: .agents/rules/ui-components.md
files:
  - app/**/*.tsx
  - components/**/*.tsx
  - features/**/*.tsx
ignores:
  - app/kitchen-sink/**/*.tsx
  - components/ui/**/*.tsx
  - "**/*.test.tsx"
  - "**/*.spec.tsx"
rule:
  pattern: <a href="/$$$REST" $$$ATTRS>$$$CHILDREN</a>
